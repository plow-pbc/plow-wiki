[project]
name = "plow-wiki"
version = "0.1.0"
description = "A curated, Obsidian-compatible wiki of durable facts for Plow agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "obsidian-wiki>=2026.9.1"]

[project.scripts]
wiki = "plow_wiki.cli:main"

[dependency-groups]
dev = [
    "okflint>=0.4.1",
    "pytest>=8.4",
    "ruff>=0.6",
]
build = ["pyinstaller>=6.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plow_wiki"]

[tool.ruff]
line-length = 100
